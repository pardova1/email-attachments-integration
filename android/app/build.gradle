plugins { id 'com.android.application' }

android {
    namespace 'com.pardova.emailattachments'
    compileSdk 36
    defaultConfig {
        applicationId 'com.pardova.emailattachments'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only the emulator test job opts in. Store releases remain unsigned.
            if (providers.gradleProperty('emulatorRelease').orNull == 'true') {
                signingConfig signingConfigs.debug
            }
        }
    }
    testBuildType 'release'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; warningsAsErrors true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
