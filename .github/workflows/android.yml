name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, strict lint and optimized release bundle
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease bundleRelease
      - name: Verify R8 output
        working-directory: android
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual minified release on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          working-directory: android
          script: ./gradlew --no-daemon -PemulatorRelease=true connectedReleaseAndroidTest
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
      # Do not publish test-key-signed APKs or the private R8 mapping as public artifacts.
