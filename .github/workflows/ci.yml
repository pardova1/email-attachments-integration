name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile
        run: npm run build
      - name: Full test suite
        run: npm test
      - name: Permanent-rule regression gates
        run: >
          node --import tsx --test
          test/authoritative-download-window.test.ts
          test/recipient-time-window-model.test.ts
          test/recipient-access.test.ts
          test/lane-access-guard.test.ts
          test/transfer-crypto-context.test.ts
          test/private-lane-lifecycle-coordinator.test.ts
          test/integrity-recovery-policy.test.ts
          test/recovery-chain-verifier.test.ts
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
