name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run build
      - name: Full test suite
        run: npm test
      - name: Permanent-rule regression gates
        run: >
          node --import tsx --test
          test/authoritative-download-window.test.ts
          test/recipient-time-window-model.test.ts
          test/recipient-access.test.ts
          test/lane-access-guard.test.ts
          test/transfer-key-vault-production-gate.test.ts
          test/vault-transit-transfer-key-vault.test.ts
          test/supabase-transfer-key-vault.test.ts
          test/transfer-crypto-context.test.ts
          test/private-lane-lifecycle-coordinator.test.ts
          test/integrity-recovery-policy.test.ts
          test/recovery-chain-verifier.test.ts
          test/transfer.test.ts
          test/transfer-state-mapper.test.ts
          test/durable-transfer-state-service.test.ts
          test/transfer-service-durable-restart.test.ts
          test/transfer-expiration-persistence.test.ts
          test/transfer-expiration-worker.test.ts
          test/supabase-storage.test.ts
          test/supabase-transfer-state-repository.test.ts
          test/security.test.ts
          test/sender-transfer-access.test.ts
          test/sender-transfer-http.test.ts
          test/sender-transfer-readiness-http.test.ts
          test/send-authorization.test.ts
          test/stripe-webhook-http.test.ts
          test/sender-transfer-client.test.ts
          test/sender-transfer-upload-client.test.ts
          test/sender-account-view.test.ts
          test/billing-client.test.ts
          test/billing-session-view.test.ts
          test/billing-http.test.ts
          test/stripe-payment-provider.test.ts
          test/payment-provider-production-composition.test.ts
          test/renewal-service.test.ts
          test/entitlement.test.ts
          test/resend-customer-email-adapter.test.ts
          test/customer-email-production-composition.test.ts
          test/idempotent-email-dispatcher.test.ts
          test/notification-delivery-claim.test.ts
          test/notification-retry-worker.test.ts
          test/supabase-notification-outbox.test.ts
          test/sender-authentication.test.ts
          test/transfer-completion-idempotency.test.ts
          test/transfer-byte-count.test.ts
          test/verified-download-service.test.ts
          test/completed-transfer-immutability.test.ts
          test/parallel-upload-progress.test.ts
          test/recipient-download-http.test.ts
          test/transfer-cache-refresh.test.ts
          test/email-integration-director.test.ts
          test/global-connection-readiness-agent.test.ts
          test/global-connection-validation-runner.test.ts
          test/https-connection-probe.test.ts
          test/automatic-connection-coordinator.test.ts
          test/customer-connection-fallback.test.ts
          test/connection-choice-combinations.test.ts
          test/exact-software-connection-catalog.test.ts
          test/profile-derived-fallback.test.ts
          test/connection-observation-discovery.test.ts
          test/connection-observation-retry.test.ts
          test/https-download-integrity-probe.test.ts
          test/connection-capacity.test.ts
          test/connection-check-http.test.ts
          test/connection-check-client.test.ts
          test/connection-form-model.test.ts
          test/connection-prefix-choice.test.ts
          test/connection-form-lifecycle.test.ts
          test/connection-coordinator-factory.test.ts
          test/connection-browser-bundle.test.ts
          test/connection-form-view.test.ts
          test/connection-session-view.test.ts
          test/browser-connection-client.test.ts
          test/observed-connection-coordinator-factory.test.ts
          test/configured-connection-http.test.ts
          test/fallback-connection-refresh.test.ts
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
