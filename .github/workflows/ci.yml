name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Commit npm-generated lockfile
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          test -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add npm-generated package lock"
          git push origin HEAD:${{ github.head_ref }}
      - name: Compile
        run: npm run build
      - name: Full test suite
        run: npm test
      - name: Permanent-rule regression gates
        run: >
          node --import tsx --test
          test/authoritative-download-window.test.ts
          test/recipient-time-window-model.test.ts
          test/recipient-access.test.ts
          test/lane-access-guard.test.ts
          test/transfer-crypto-context.test.ts
          test/private-lane-lifecycle-coordinator.test.ts
          test/integrity-recovery-policy.test.ts
          test/recovery-chain-verifier.test.ts
          test/transfer.test.ts
          test/transfer-state-mapper.test.ts
          test/durable-transfer-state-service.test.ts
          test/transfer-service-durable-restart.test.ts
          test/transfer-expiration-persistence.test.ts
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
